name: Build Signed AAB

on:
  workflow_dispatch:
    inputs:
      game:
        description: 'Game to build'
        required: true
        type: choice
        default: 'dungeon-bolt'
        options:
          - dungeon-bolt
          - arcade-collection
          - brainrot-quiz
          - code-conquest
          - bolt-blocks
          - bolt-solitaire
          - escape-room
          - quest-rpg
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > jellybolt-release.keystore

      - name: Build TWA AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          declare -A projects=(
            [dungeon-bolt]=android-app-dungeonbolt
            [arcade-collection]=android-app
            [brainrot-quiz]=android-app-brainrot
            [code-conquest]=android-app-codeconquest
            [bolt-blocks]=android-app-boltblocks
            [bolt-solitaire]=android-app-boltsolitaire
            [escape-room]=android-app-escaperoom
            [quest-rpg]=android-app-questrpg
          )

          if [[ "${{ inputs.game }}" == "all" ]]; then
            build_projects=("${projects[@]}")
          else
            build_projects=("${projects[${{ inputs.game }}]}")
          fi

          for project in "${build_projects[@]}"; do
            echo "Building ${project}"
            chmod +x "${project}/gradlew"
            (
              cd "${project}"
              ./gradlew bundleRelease \
                -Pandroid.injected.signing.store.file="${{ github.workspace }}/jellybolt-release.keystore" \
                -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
                -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
                -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
            )
          done

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellybolt-release-aab-${{ inputs.game }}
          path: android-app*/app/build/outputs/bundle/release/*.aab
          retention-days: 30
