name: Personal handwriting Android

on:
  pull_request:
    paths:
      - 'android-app-handwriting/**'
      - '.github/workflows/handwriting-android.yml'
  push:
    paths:
      - 'android-app-handwriting/**'
      - '.github/workflows/handwriting-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build and exercise offline app
        working-directory: android-app-handwriting
        run: bash ./gradlew testDebugUnitTest assembleDebug lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: my-writing-debug-apk
          path: android-app-handwriting/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-writing-reports
          path: android-app-handwriting/app/build/reports/
